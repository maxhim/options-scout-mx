# Options Scout Engine — настройки
# Вотчлист: твои бумаги, всегда разбираются целиком. Идеи ищутся по всей вселенной ниже.
watchlist: [APP, LLY, FSLR, W, SNDK, RACE, TSLA, NVDA, AMD, AAPL, GOOGL, META, MSFT, AMZN, COIN, RDDT]

universe:
  # Кандидаты: ~110 самых ликвидных опционных акций США. Каждый день проходят фильтры ниже,
  # затем топ по предварительному сигналу (тренд + сила к рынку) получает полный разбор опционов.
  min_price: 30                 # дешёвые акции отсекаются
  min_dollar_volume: 300000000  # средний оборот за 20 дней, $ (300 млн — только по-настоящему ликвидные)
  min_option_oi: 3000           # открытый интерес опционов около денег (±10% от цены), шт.
  deep_scan: 30                 # сколько бумаг получают полный разбор (включая вотчлист)
  tickers: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, AVGO, AMD, NFLX, ORCL, CRM, ADBE, INTC, QCOM, MU, TXN,
            AMAT, LRCX, KLAC, MRVL, ARM, TSM, SMCI, DELL, IBM, CSCO, ANET, NOW, SNOW, PLTR, CRWD, PANW, ZS, NET,
            DDOG, SHOP, UBER, ABNB, DASH, COIN, HOOD, MSTR, RDDT, APP, SNDK, WDC, STX, XYZ, PYPL, SOFI, AFRM,
            JPM, BAC, WFC, C, GS, MS, SCHW, AXP, V, MA, BLK, LLY, UNH, JNJ, PFE, MRK, ABBV, AMGN, GILD, VRTX,
            ISRG, TMO, NVO, HIMS, WMT, COST, TGT, HD, LOW, NKE, SBUX, MCD, CMG, LULU, DIS, KO, PEP, PG, XOM, CVX,
            OXY, COP, SLB, BA, CAT, DE, GE, GEV, LMT, RTX, UPS, FDX, BABA, PDD, FSLR, CEG, VST, ENPH, RACE, W]

telegram:
  bot_username: option_scout_bot   # запасной вариант: движок сам спрашивает имя бота у Telegram

account:
  size_usd: 10000          # размер депозита
  risk_per_trade_pct: 2.0  # макс. риск на одну идею, % депозита
  max_position_pct: 20     # макс. доля одной акции в депозите

options:
  max_premium_usd: 100     # (запасной лимит; реальный отбор — по категориям tiers ниже)
  tiers:                   # по одной лучшей опционной идее в каждой ценовой категории
    - {key: cheap,   max_usd: 100,               min_score: 60, max_be_to_em: 1.25}
    - {key: mid,     min_usd: 100, max_usd: 200, min_score: 60, max_be_to_em: 1.1}
    - {key: premium, min_usd: 200, max_usd: 500, min_score: 65, max_be_to_em: 1.25, min_pop: 0.40}  # только высокие шансы
  rebound:                 # эксперимент: колл после обвала / пут после взлёта (против тренда)
    max_usd: 200
    max_be_to_em: 1.25
    min_score: 50
    max_ideas: 2
  dte_min: 3               # окно экспираций для сделок (дни)
  dte_max: 14
  delta_min: 0.15
  delta_max: 0.55
  min_open_interest: 100
  max_spread_pct: 0.25     # (ask-bid)/mid
  max_be_to_em: 1.25       # безубыток не дальше 1.25 ожидаемого движения (у справедливо оценённых
                           # опционов вне денег он и так около 1.0-1.2; строже = почти никогда)
  target_pct: 100          # тейк: +100% к премии
  stop_pct: 50             # стоп: -50% премии

stocks:                    # идея = 1 акция, размер позиции решает сам пользователь
  max_hold_days: 10        # горизонт идеи, торговых дней
  target_sigma: 1.0        # цель = ожидаемое движение за горизонт по max(IV30, HV20) x это число
  reward_risk: 2.0         # стоп = цель / 2 ...
  stop_atr_min: 1.0        # ... но не ближе 1 ATR (дневной шум)
  min_reward_risk: 1.5     # хуже 1.5:1 из-за дневного шума: идея остаётся с пометкой «высокая волатильность»
  high_vol: 0.6            # от 60% годовой волатильности тоже помечается (хуже 1:1 идеи нет совсем)

alerts:
  min_score: 65            # дневной алерт о новой идее только от этой силы сигнала

signals:
  exhaustion:              # «риск отскока»: сила вдвое ниже, если идея догоняет уже ушедшее движение
    rsi_low: 30            # шорт при RSI ниже
    rsi_high: 70           # лонг при RSI выше
    weeks: 2.0             # или движение за 5 дней больше 2 ожидаемых недельных (по max(IV30, HV20))
  scan_dte_max: 45         # какие экспирации учитывать для OI/потока
  unusual_min_volume: 500
  unusual_vol_oi: 1.5
  weights:                 # вклад компонентов в направление (сумма = 1)
    trend: 0.30
    flow: 0.30             # прирост OI, взвешенный премией
    unusual: 0.20          # необычный объём (volume > OI)
    confirmed: 0.20        # вчерашний необычный объём, подтверждённый ростом OI

output:
  top_options: 5
  top_stocks: 5
  min_score: 55            # акции: ниже — «сильных идей нет», показываются только ближайшие кандидаты
  max_per_sector: 2        # не больше 2 идей из одного сектора на весь бриф (5 шортов по чипам = одна ставка)

# Ручные даты отчётностей (Tradier их не даёт). yfinance подтягивает сам.
earnings: {}
#  NVDA: 2026-11-19
