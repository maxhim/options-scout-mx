name: daily-brief

# Время по Нью-Йорку, по две строки cron на каждый запуск (летнее и зимнее время), лишнюю отсекает --window.
#   11:00 и 13:30  дневной алерт: новые сильные идеи и закрытые по тейку/стопу (только если что-то есть)
#   15:35          вечерний бриф (21:35 по Мадриду); по пятницам с итогами недели
on:
  schedule:
    - cron: "0 15,16 * * 1-5"
    - cron: "30 17,18 * * 1-5"
    - cron: "35 19 * * 1-5"
    - cron: "35 20 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "test: проверка, журнал не трогается · brief: настоящий бриф · alert: настоящий дневной алерт"
        type: choice
        options: [test, brief, alert]
        default: test

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run scanner
        id: scan
        env:
          SCOUT_PROVIDER: ${{ vars.SCOUT_PROVIDER || 'yfinance' }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}   # только если SCOUT_PROVIDER=tradier
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCOUT_REPORT_URL: ${{ vars.SCOUT_REPORT_URL }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = schedule ]; then
            case "$CRON" in "35 "*) FLAGS="--window" ;; *) FLAGS="--intraday --window" ;; esac
          else
            case "$MODE" in brief) FLAGS="" ;; alert) FLAGS="--intraday" ;; *) FLAGS="--test" ;; esac
          fi
          echo "flags: $FLAGS"
          case "$FLAGS" in *--test*) echo "test=true" >> "$GITHUB_OUTPUT" ;; esac
          python -m scout run --notify $FLAGS
      - name: Save history (database + reports)
        if: steps.scan.outputs.test != 'true'
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add data/scout.db reports/
          git commit -m "brief $(date -u +%F-%H%M)" || echo "nothing to commit"
          git pull --rebase -q || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports
      - id: deploy
        uses: actions/deploy-pages@v4
