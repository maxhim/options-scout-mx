name: daily-brief

# Скан в последний час сессии (15:35 по Нью-Йорку = 21:35 по Мадриду): у Yahoo после закрытия
# пропадают bid/ask. Два расписания покрывают летнее и зимнее время, лишнее отсекает --window.
on:
  schedule:
    - cron: "35 19 * * 1-5"
    - cron: "35 20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run scanner
        env:
          SCOUT_PROVIDER: ${{ vars.SCOUT_PROVIDER || 'yfinance' }}
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}   # только если SCOUT_PROVIDER=tradier
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCOUT_REPORT_URL: ${{ vars.SCOUT_REPORT_URL }}
        run: python -m scout run --notify ${{ github.event_name == 'schedule' && '--window' || '' }}
      - name: Save history (database + reports)
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add data/scout.db reports/
          git commit -m "brief $(date -u +%F)" || echo "nothing to commit"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports
      - id: deploy
        uses: actions/deploy-pages@v4
